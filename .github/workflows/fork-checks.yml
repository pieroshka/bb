name: Fork checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'pieroshka/bb'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build and verify the fork
        run: bash .fork/verify.sh
      - name: Verify isolated container boot and rollback before marking deployable
        run: |
          docker build -t bb-fork-ci -f .fork/container/Dockerfile .
          docker run --rm --network none --memory 5g --cpus 4 --entrypoint pnpm bb-fork-ci exec turbo run test test:integration --filter=@bb/agent-runtime --force -- upstream-http-capture.test.ts integration.http-capture.test.ts
          docker run --rm --network none --memory 5g --cpus 4 --entrypoint node bb-fork-ci .fork/deployment.smoke.mjs
          docker build -t bb-fork-adoption-ci -f .fork/container/Adoption.Dockerfile .
          docker run --rm --network none --memory 5g --cpus 4 bb-fork-adoption-ci

  mark_verified:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Mark the tested main commit for unattended deployment
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$VERIFIED_SHA"
          git push origin "$VERIFIED_SHA:refs/heads/fork-verified"
